<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Feed</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
    }
    .side-column {
      background-color: #198754; /* same green as registration page button */
      min-height: 100vh;
    }
    .post-card {
      border: 1px solid #ccc;
      margin: 20px 0;
      padding: 15px;
      border-radius: 8px;
      background: #fff;
    }
    .post-card img {
      max-width: 100%;
      border-radius: 5px;
    }
    .nav-item .active {
            font-weight: 500;
        }
        .nav-link:hover {
            font-weight: 500;
        }
  </style>
</head>
<body>
   <!-- Josh Navbar (Issue #18) -->
    <nav class="navbar navbar-dark navbar-expand-sm bg-success">
        <div class="container-fluid">
            <a class="navbar-brand ms-3" href="/feed.html" style="background-color: white;">
                <img
                  width="70px"
                  height="70px"
                  src="../images/logo.svg"
                  alt="Logo"
                />
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Navigation Toggle">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link text-light active" href="/feed.html">Feed</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light " aria-current="page" href="/search.html">Search</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light" href="/create-post.html">Create Post</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light" href="/user.html">User</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
  <div class="container-fluid">
    <div class="row">
      <!-- Left Column -->
      <div class="col-1 side-column"></div>

      <!-- Middle Column (Feed Section) -->
      <div class="col-10">
        <h2 class="mt-4">Your Feed</h2>

        <div id="user-posts" class="row mt-3"></div>
      </div>

      <!-- Right Column -->
      <div class="col-1 side-column"></div>
    </div>
  </div>
  <script src = "feed.js"></script>

</html>
