<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Notyf -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
      }
      .side-column {
        background-color: #198754; /* same green as registration page button */
        min-height: 100vh;
      }
      .nav-item .active {
        font-weight: 500;
      }
      .nav-link:hover {
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <!-- Josh Navbar (Issue #18) -->
    <nav class="navbar navbar-dark navbar-expand-sm bg-success">
      <div class="container-fluid">
        <a
          class="navbar-brand ms-3"
          href="/feed.html"
          style="background-color: white"
        >
          <img width="70px" height="70px" src="../images/logo.svg" alt="Logo" />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Navigation Toggle"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link text-light" href="/feed.html">Feed</a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link text-light active"
                aria-current="page"
                href="/search.html"
                >Search</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link text-light" href="/create-post.html"
                >Create Post</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link text-light" href="/user.html">User</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container-fluid">
      <div class="row">
        <!-- Left Column -->
        <div class="col-1 side-column"></div>

        <!-- Middle Column (Search Section) -->
        <div class="col-10">
          <h2 class="mt-4">Search</h2>

          <!-- Search Section -->
          <div class="container mt-5 text-center">
            <h2 class="mb-4">Search Posts</h2>
            <div class="row justify-content-center">
              <div class="col-md-8 col-lg-6">
                <form class="input-group">
                  <select
                    class="form-select"
                    id="searchType"
                    aria-label="Search type"
                  >
                    <option value="user">User</option>
                    <option value="title">Title</option>
                    <option value="tag">Tag</option>
                  </select>
                  <input
                    type="text"
                    class="form-control"
                    id="searchInput"
                    placeholder="Enter your search term..."
                    aria-label="Search term"
                  />
                  <button class="btn btn-success" id="searchBtn" type="submit">
                    Search
                  </button>
                </form>
              </div>
            </div>
          </div>

          <div class="search-results m-5"></div>
        </div>

        <!-- Right Column -->
        <div class="col-1 side-column"></div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="search.js"></script>
  </body>
</html>
