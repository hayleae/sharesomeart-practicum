<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit Post | ShareSomeArt</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      :root {
        --brand-green: #198754;
      }

      .bg-brand {
        background-color: var(--brand-green) !important;
      }

      .dropzone {
        border: 2px dashed rgba(0, 0, 0, 0.15);
        border-radius: 0.75rem;
        padding: 1.25rem;
        background-color: rgba(0, 0, 0, 0.02);
      }
    </style>
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark navbar-expand-sm bg-success">
      <div class="container-fluid">
        <a class="navbar-brand ms-3" href="/feed.html" style="background-color: white;">
          <img width="70" height="70" src="../images/logo.svg" alt="Logo" />
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link text-light" href="/feed.html">Feed</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-light" href="/search.html">Search</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-light" href="/create-post.html">Create Post</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-light active" href="/edit-post.html">Edit Post</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-light" href="/user.html">User</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Page body -->
    <div class="container-fluid min-vh-100">
      <div class="row min-vh-100">
        <div class="col-1 d-none d-md-block bg-brand"></div>

        <div class="col-12 col-md-10 d-flex justify-content-center align-items-center py-5">
          <div class="card shadow-lg w-100" style="max-width: 720px; border-radius: 1rem;">
            <div class="card-body p-4 p-md-5">
              <h2 class="text-center mb-4">Edit Post</h2>

              <form class="edit-post-form" method="POST">

                <!-- Image -->
                <div class="mb-3">
                  <label for="imageFile" class="form-label">Image File (optional)</label>
                  <div class="dropzone">
                    <input
                      type="file"
                      id="imageFile"
                      name="imageFile"
                      class="form-control"
                      accept="image/*"
                    />
                  </div>
                  <small class="text-muted">Leave empty to keep existing image.</small>
                </div>

                <!-- Title -->
                <div class="mb-3">
                  <label for="title" class="form-label">Title</label>
                  <input
                    type="text"
                    id="title"
                    name="title"
                    class="form-control"
                    placeholder="Post title"
                  />
                </div>

                <!-- Description -->
                <div class="mb-3">
                  <label for="description" class="form-label">Description</label>
                  <textarea
                    id="description"
                    name="description"
                    class="form-control"
                    rows="4"
                    placeholder="Post description"
                  ></textarea>
                </div>

                <!-- Tag -->
                <div class="mb-4">
                  <label for="tag" class="form-label">Tag</label>
                  <input
                    type="text"
                    id="tag"
                    name="tag"
                    class="form-control"
                    placeholder="e.g., digital, portrait"
                  />
                </div>

                <!-- Save -->
                <button class="btn btn-primary w-100" type="submit" id="submit-btn">
                    <span class="spinner-border spinner-border-sm d-none" id="spinner"></span>
                    <span id="btn-txt">Save Changes</span>
                </button>

              </form>
            </div>
          </div>
        </div>

        <div class="col-1 d-none d-md-block bg-brand"></div>
      </div>
    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
    <script src="editPost.js"></script>

  </body>
</html>
