<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Post Details | ShareSomeArt</title>
<!-- Bootstrap 5 -->
<link

      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"

      rel="stylesheet"

    />
<!-- Notyf -->
<link

      rel="stylesheet"

      href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css"

    />
<style>

      /* Use your registration page green — replace this if it's different */
 
      :root {

        --brand-green: #198754;

      }
 
      .bg-brand {

        background-color: var(--brand-green) !important;

      }
 
      .btn-brand {

        background-color: var(--brand-green);

        border-color: var(--brand-green);

        color: #fff;

      }
 
      .btn-brand:hover {

        filter: brightness(0.95);

      }
 
      .dropzone {

        border: 2px dashed rgba(0, 0, 0, 0.15);

        border-radius: 0.75rem;

        padding: 1.25rem;

        background-color: rgba(0, 0, 0, 0.02);

      }
 
      .side-column {

        background-color: #04aa6d; /* same green as registration page button */

        min-height: 100vh;

      }
 
      .nav-item .active {

        font-weight: 500;

      }
 
      .nav-link:hover {

        font-weight: 500;

      }
 
      #image {

        width: 400px;

        height: 550px;

        border-radius: 5px;

      }
</style>
</head>
 
  <body>
<!-- Josh Navbar (Issue #18) -->
<nav class="navbar navbar-dark navbar-expand-sm bg-success">
<div class="container-fluid">
<a

          class="navbar-brand ms-3"

          href="/feed.html"

          style="background-color: white"
>
<img width="70px" height="70px" src="../images/logo.svg" alt="Logo" />
</a>
<button

          class="navbar-toggler"

          type="button"

          data-bs-toggle="collapse"

          data-bs-target="#navbarNav"

          aria-controls="navbarNav"

          aria-expanded="false"

          aria-label="Navigation Toggle"
>
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse" id="navbarNav">
<ul class="navbar-nav">
<li class="nav-item">
<a class="nav-link text-light" href="/feed.html">Feed</a>
</li>
<li class="nav-item">
<a

                class="nav-link text-light"

                aria-current="page"

                href="/search.html"
>Search</a
>
</li>
<li class="nav-item">
<a class="nav-link text-light active" href="/create-post.html"
>Create Post</a
>
</li>
<li class="nav-item">
<a class="nav-link text-light" href="/user.html">User</a>
</li>
</ul>
</div>
</div>
</nav>
<div class="container-fluid min-vh-100">
<div class="row min-vh-100">
<!-- Left green side -->
<div class="col-1 d-none d-md-block bg-brand"></div>
<!-- Center content -->
<div class="col-12 col-md-10">
<div class="p-5 d-flex justify-content-between align-items-center">
<div id="edit-area"></div>
<div id="delete-area"></div>
</div>
<section class="d-flex justify-content-center align-items-center">
<div>
<div class="img-container">
<img id="image" />
</div>
<h5 id="title" class="my-2"></h5>
<p id="description"></p>
<p id="tag" class="badge text-bg-success"></p>
<p>

                Written by: <span class="text-capitalize" id="author"></span>
</p>
<div class="bg-light mt-5 border-top">
<h4 class="my-2">Comments</h4>
 
                <div class="form-floating my-3">
<textarea

                    class="form-control"

                    placeholder="Leave a comment here"

                    id="comment-area"

                    style="height: 100px"
></textarea>
<label for="comment-area">Comments</label>
</div>
 
                <div class="my-3 w-100" id="comments"></div>
</div>
</div>
</section>
</div>
<!-- Right green side -->
<div class="col-1 d-none d-md-block bg-brand"></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
<script src="post.js"></script>
</body>
</html>
