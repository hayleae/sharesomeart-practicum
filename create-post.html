<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create Post | ShareSomeArt</title>
    <!--Larissa Allen-->
    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Notyf -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css"
    />

    <style>
      /* Use your registration page green — replace this if it's different */
      :root {
        --brand-green: #198754;
      }

      .bg-brand {
        background-color: var(--brand-green) !important;
      }
      .btn-brand {
        background-color: var(--brand-green);
        border-color: var(--brand-green);
        color: #fff;
      }
      .btn-brand:hover {
        filter: brightness(0.95);
      }

      .dropzone {
        border: 2px dashed rgba(0, 0, 0, 0.15);
        border-radius: 0.75rem;
        padding: 1.25rem;
        background-color: rgba(0, 0, 0, 0.02);
      }
      .side-column {
        background-color: #04aa6d; /* same green as registration page button */
        min-height: 100vh;
      }
      .nav-item .active {
        font-weight: 500;
      }
      .nav-link:hover {
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <!-- Josh Navbar (Issue #18) -->
    <nav class="navbar navbar-dark navbar-expand-sm bg-success">
        <div class="container-fluid">
            <a class="navbar-brand ms-3" href="/feed.html" style="background-color: white;">
                <img
                  width="70px"
                  height="70px"
                  src="../images/logo.svg"
                  alt="Logo"
                />
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Navigation Toggle">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link text-light" href="/feed.html">Feed</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light" aria-current="page" href="/search.html">Search</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light active" href="/create-post.html">Create Post</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light" href="/user.html">User</a>
                    </li>
                </ul>
            </div>
    </nav>
    <div class="container-fluid min-vh-100">
      <div class="row min-vh-100">
        <!-- Left green side -->
        <div class="col-1 d-none d-md-block bg-brand"></div>

        <!-- Center content -->
        <div
          class="col-12 col-md-10 d-flex justify-content-center align-items-center py-5"
        >
          <div
            class="card shadow-lg w-100"
            style="max-width: 720px; border-radius: 1rem"
          >
            <div class="card-body p-4 p-md-5">
              <h2 class="text-center mb-4">Create Post</h2>

              <form class="create-post-form" method="POST">
                <!-- Image File -->
                <div class="mb-3">
                  <label for="imageFile" class="form-label">Image File</label>
                  <div class="dropzone">
                    <input
                      class="form-control"
                      type="file"
                      id="imageFile"
                      accept="image/*"
                    />
                  </div>
                </div>

                <!-- Title -->
                <div class="mb-3">
                  <label for="title" class="form-label">Title</label>
                  <input
                    type="text"
                    id="title"
                    class="form-control"
                    placeholder="Enter post title"
                  />
                </div>

                <!-- Description -->
                <div class="mb-3">
                  <label for="description" class="form-label"
                    >Description</label
                  >
                  <textarea
                    id="description"
                    class="form-control"
                    rows="4"
                    placeholder="Write a short description"
                  ></textarea>
                </div>

                <!-- Tag -->
                <div class="mb-4">
                  <label for="tag" class="form-label">Tag</label>
                  <input
                    type="text"
                    id="tag"
                    class="form-control"
                    placeholder="e.g. digital, portrait, sketch"
                  />
                </div>
                <button class="btn btn-primary w-100" type="submit" id="submit-btn">
                    <span class="spinner-border spinner-border-sm d-none" id="spinner"></span>
                    <span id="btn-txt">Submit</span>
                </button>
              </form>
            </div>
          </div>
        </div>

        <!-- Right green side -->
        <div class="col-1 d-none d-md-block bg-brand"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
    <script src="createPost.js"></script>
  </body>
</html>
