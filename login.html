<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1" />
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css"
    />

    <!-- css related code which we can have either in 
     same jsp or separately also in a css file -->
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }
      form {
        border: 3px solid #f1f1f1;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 12px 20px;
        margin: 8px 0;
        display: inline-block;
        border: 1px solid #ccc;
        box-sizing: border-box;
      }

      button {
        background-color: #198754;
        color: white;
        padding: 14px 20px;
        margin: 8px 0;
        border: none;
        cursor: pointer;
        width: 100%;
      }

      button:hover {
        opacity: 0.8;
      }

      .cancelbutton {
        width: auto;
        padding: 10px 18px;
        background-color: #f44336;
      }

      .container {
        padding: 16px;
      }

      span.psw {
        float: right;
        padding-top: 16px;
      }

      /* Change styles for span and cancel button
   on extra small screens */
      @media screen and (max-width: 300px) {
        span.psw {
          display: block;
          float: none;
        }
        .cancelbutton {
          width: 100%;
        }
      }
    </style>

    <!-- End of css related code which we can have either in 
     same jsp or separately also in a css file -->
  </head>
  <body>
    <form class="login-form">
      <div class="container">
        <label for="username-or-email"><b>Email or username</b></label>
        <input
          type="text"
          placeholder="Please enter your email or username"
          name="usernameOrEmail"
          id="usernameOrEmail"
          required
        />

        <label for="password"><b>Password</b></label>
        <input
          type="password"
          placeholder="Please enter Password"
          name="password"
          id="pass"
          required
        />

        <button type="submit">Login</button>
      </div>
      <div class="container" style="background-color: #f1f1f1">
        <button type="button" class="cancelbutton">Cancel</button>
        <span class="psw"><a href="register.html">New User?</a></span>
      </div>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
    <script src="login.js"></script>
  </body>
</html>
